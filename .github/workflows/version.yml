name: Version

# Releases from the GitHub UI (or mobile): pick a bump, this workflow bumps
# package.json, commits, tags, pushes, then dispatches the Publish workflow
# on the new tag. Only users with write access can run it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bump version
        run: pnpm bumpp ${{ inputs.bump }} --yes --no-commit --no-tag --no-push

      # main requires signed commits: a commit created through the GraphQL API
      # with GITHUB_TOKEN is signed by GitHub, a `git push` from the runner is not
      - name: Commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$GITHUB_SHA" \
            --arg message "chore: release v${VERSION}" \
            --arg contents "$(base64 -w0 package.json)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: $message },
                fileChanges: { additions: [{ path: "package.json", contents: $contents }] }
              } }
            }' > commit.json
          OID=$(gh api graphql --input commit.json -q .data.createCommitOnBranch.commit.oid)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="$OID" > /dev/null

      # tags created with GITHUB_TOKEN do not trigger `push` workflows,
      # so the Publish workflow is dispatched explicitly on the new tag
      - name: Dispatch publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh workflow run publish.yml --ref "refs/tags/v${VERSION}"
