name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # optional: contents of key.pem, keeps a stable Chrome extension ID
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build first: it generates src/auto-imports.d.ts, which typecheck needs
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm vitest run

      - name: Pack zip and xpi
        run: |
          pnpm pack:zip
          pnpm pack:xpi

      - name: Pack crx
        if: env.CRX_PRIVATE_KEY != ''
        run: |
          printf '%s' "$CRX_PRIVATE_KEY" > key.pem
          pnpm pack:crx
          rm -f key.pem

      - name: Resolve tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "value=v$VERSION-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "value=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="extension.zip extension.xpi"
          [ -f extension.crx ] && ASSETS="$ASSETS extension.crx"
          gh release create "${{ steps.tag.outputs.value }}" $ASSETS \
            --title "${{ steps.tag.outputs.value }} — Comark for GitHub" \
            --generate-notes
